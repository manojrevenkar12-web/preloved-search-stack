[project]
name = "preloved-search-stack"
version = "1.0.0"
description = "Multistage composable search for a pre-loved luxury marketplace, with an offline-to-online measurement study"
requires-python = ">=3.11"
authors = [{ name = "Manoj Kumar Prakash", email = "manojrevenkar12@gmail.com" }]
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "pyarrow>=14", "duckdb>=1.0", "fastapi>=0.110",
                "uvicorn>=0.29"]

[project.optional-dependencies]
train = ["torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B023"]
